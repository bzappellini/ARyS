<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Arquitectura SNMP: manager y agentes">
  <defs>
    <marker id="sn-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#35C4DC"/></marker>
    <marker id="sn-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF9900"/></marker>
  </defs>

  <!-- Manager / NMS -->
  <rect x="12" y="110" width="288" height="230" rx="14" fill="rgba(10,99,196,.16)" stroke="#6FA8E0" stroke-width="3"/>
  <text x="156" y="152" text-anchor="middle" font-size="25" font-weight="800" fill="#C9DEF5">Manager (NMS)</text>
  <text x="156" y="190" text-anchor="middle" font-size="19" fill="#C9D4E0">consulta, grafica,</text>
  <text x="156" y="214" text-anchor="middle" font-size="19" fill="#C9D4E0">alerta</text>
  <text x="156" y="254" text-anchor="middle" font-size="17" fill="#9FB2C7">Zabbix, LibreNMS,</text>
  <text x="156" y="277" text-anchor="middle" font-size="17" fill="#9FB2C7">PRTG, Observium…</text>
  <!-- MIB note -->
  <text x="156" y="316" text-anchor="middle" font-size="16" fill="#8A97A6">cada dato = un OID en la MIB</text>

  <!-- Agents -->
  <g text-anchor="middle" fill="#DCE7F3">
    <rect x="620" y="16" width="444" height="84" rx="12" fill="#0A2540" stroke="#3DA35D" stroke-width="3"/>
    <text x="668" y="70" font-size="40">🌐</text><text x="880" y="54" font-size="25" font-weight="700">Router / Switch</text><text x="880" y="82" font-size="17" fill="#9FB2C7">agente + MIB</text>
    <rect x="620" y="183" width="444" height="84" rx="12" fill="#0A2540" stroke="#3DA35D" stroke-width="3"/>
    <text x="668" y="237" font-size="40">🖥️</text><text x="880" y="221" font-size="25" font-weight="700">Servidor</text><text x="880" y="249" font-size="17" fill="#9FB2C7">agente + MIB</text>
    <rect x="620" y="350" width="444" height="84" rx="12" fill="#0A2540" stroke="#3DA35D" stroke-width="3"/>
    <text x="668" y="404" font-size="40">🖨️</text><text x="880" y="388" font-size="25" font-weight="700">Impresora / UPS / AP</text><text x="880" y="416" font-size="17" fill="#9FB2C7">agente + MIB</text>
  </g>

  <!-- GET/SET arrows (manager -> agents, 161) -->
  <path d="M300 170 C 460 170, 480 58, 620 58" stroke="#35C4DC" stroke-width="3.5" fill="none" marker-end="url(#sn-g)"/>
  <path d="M300 225 L 620 225" stroke="#35C4DC" stroke-width="3.5" fill="none" marker-end="url(#sn-g)"/>
  <path d="M300 280 C 460 280, 480 392, 620 392" stroke="#35C4DC" stroke-width="3.5" fill="none" marker-end="url(#sn-g)"/>
  <rect x="335" y="205" width="250" height="40" rx="8" fill="#02141f"/>
  <text x="460" y="232" text-anchor="middle" font-size="19" fill="#9EE7F5">GET / SET → puerto 161</text>

  <!-- TRAP arrow (agent -> manager, 162) -->
  <path d="M620 418 C 460 420, 330 400, 250 342" stroke="#FF9900" stroke-width="3.5" fill="none" stroke-dasharray="7 5" marker-end="url(#sn-o)"/>
  <text x="440" y="443" text-anchor="middle" font-size="18" fill="#FFC061">TRAP / INFORM ← puerto 162 (avisos)</text>
</svg>
