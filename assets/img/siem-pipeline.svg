<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Pipeline de monitoreo de seguridad: fuentes, SIEM y SOC">
  <defs>
    <marker id="si-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
    <marker id="si-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF9900"/></marker>
  </defs>

  <!-- Sources -->
  <text x="140" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#9FB2C7">Fuentes</text>
  <g text-anchor="middle" font-size="13" fill="#DCE7F3">
    <rect x="40" y="60" width="200" height="42" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="140" y="86">SNMP (métricas)</text>
    <rect x="40" y="115" width="200" height="42" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="140" y="141">Syslog (logs)</text>
    <rect x="40" y="170" width="200" height="42" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="140" y="196">NetFlow / IPFIX (flujos)</text>
    <rect x="40" y="225" width="200" height="42" rx="8" fill="#3a1416" stroke="#E5484D"/><text x="140" y="251" fill="#F2A6A8">IDS / firewall (U5)</text>
    <rect x="40" y="280" width="200" height="42" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="140" y="306">Endpoints / apps</text>
  </g>

  <!-- SIEM -->
  <rect x="410" y="140" width="230" height="130" rx="14" fill="rgba(255,153,0,.12)" stroke="#FF9900" stroke-width="2.5"/>
  <text x="525" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#FFC061">SIEM</text>
  <text x="525" y="206" text-anchor="middle" font-size="13" fill="#C9D4E0">centraliza + correlaciona</text>
  <text x="525" y="226" text-anchor="middle" font-size="13" fill="#C9D4E0">+ detecta patrones</text>
  <text x="525" y="252" text-anchor="middle" font-size="12" fill="#9FB2C7">Wazuh · Elastic · Splunk</text>

  <!-- arrows sources -> SIEM -->
  <g stroke="#9FB2C7" stroke-width="2" fill="none">
    <path d="M240 81 C 330 90, 350 160, 410 175" marker-end="url(#si-a)"/>
    <path d="M240 136 C 330 145, 350 185, 410 195" marker-end="url(#si-a)"/>
    <path d="M240 191 L 410 205" marker-end="url(#si-a)"/>
    <path d="M240 246 C 330 240, 350 220, 410 218" marker-end="url(#si-a)"/>
    <path d="M240 301 C 330 300, 350 250, 410 238" marker-end="url(#si-a)"/>
  </g>

  <!-- SOC outputs -->
  <text x="880" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#9FB2C7">SOC · respuesta</text>
  <g text-anchor="middle" font-size="13" fill="#DCE7F3">
    <rect x="780" y="120" width="220" height="44" rx="8" fill="rgba(53,196,220,.10)" stroke="#35C4DC"/><text x="890" y="147" fill="#9EE7F5">📊 Dashboards</text>
    <rect x="780" y="178" width="220" height="44" rx="8" fill="rgba(255,153,0,.10)" stroke="#FF9900"/><text x="890" y="205" fill="#FFC061">🔔 Alertas</text>
    <rect x="780" y="236" width="220" height="44" rx="8" fill="rgba(61,163,93,.10)" stroke="#3DA35D"/><text x="890" y="263" fill="#8FE0A8">🛡️ Respuesta a incidentes</text>
  </g>
  <g stroke="#FF9900" stroke-width="2.5" fill="none">
    <path d="M640 190 C 700 180, 720 150, 780 145" marker-end="url(#si-o)"/>
    <path d="M640 205 L 780 202" marker-end="url(#si-o)"/>
    <path d="M640 220 C 700 235, 720 255, 780 258" marker-end="url(#si-o)"/>
  </g>

  <text x="540" y="360" text-anchor="middle" font-size="14.5" fill="#C9D4E0">El monitoreo cierra el ciclo: <tspan fill="#FFC061" font-weight="700">detectar → responder → mejorar</tspan></text>
  <text x="540" y="390" text-anchor="middle" font-size="13" fill="#8A97A6">La seguridad es un proceso (Unidad 1): sin visibilidad, no hay defensa</text>
</svg>
