<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Pipeline de monitoreo de seguridad: fuentes, SIEM y SOC">
  <defs>
    <marker id="si-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
    <marker id="si-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FF9900"/></marker>
  </defs>

  <!-- Sources -->
  <text x="150" y="28" text-anchor="middle" font-size="21" font-weight="700" fill="#9FB2C7">Fuentes</text>
  <g text-anchor="middle" font-size="19" fill="#DCE7F3">
    <rect x="10" y="46" width="280" height="50" rx="10" fill="#0A2540" stroke="#3A4A5C" stroke-width="2"/><text x="150" y="78">SNMP (métricas)</text>
    <rect x="10" y="106" width="280" height="50" rx="10" fill="#0A2540" stroke="#3A4A5C" stroke-width="2"/><text x="150" y="138">Syslog (logs)</text>
    <rect x="10" y="166" width="280" height="50" rx="10" fill="#0A2540" stroke="#3A4A5C" stroke-width="2"/><text x="150" y="198">NetFlow / IPFIX (flujos)</text>
    <rect x="10" y="226" width="280" height="50" rx="10" fill="#3a1416" stroke="#E5484D" stroke-width="2"/><text x="150" y="258" fill="#F2A6A8">IDS / firewall (U5)</text>
    <rect x="10" y="286" width="280" height="50" rx="10" fill="#0A2540" stroke="#3A4A5C" stroke-width="2"/><text x="150" y="318">Endpoints / apps</text>
  </g>

  <!-- SIEM -->
  <rect x="410" y="106" width="280" height="170" rx="14" fill="rgba(255,153,0,.12)" stroke="#FF9900" stroke-width="3"/>
  <text x="550" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#FFC061">SIEM</text>
  <text x="550" y="188" text-anchor="middle" font-size="19" fill="#C9D4E0">centraliza + correlaciona</text>
  <text x="550" y="213" text-anchor="middle" font-size="19" fill="#C9D4E0">+ detecta patrones</text>
  <text x="550" y="254" text-anchor="middle" font-size="17" fill="#9FB2C7">Wazuh · Elastic · Splunk</text>

  <!-- arrows sources -> SIEM (end points spread along the left edge) -->
  <g stroke="#9FB2C7" stroke-width="2.5" fill="none">
    <path d="M290 71 C 350 71, 350 128, 410 128" marker-end="url(#si-a)"/>
    <path d="M290 131 C 350 131, 350 160, 410 160" marker-end="url(#si-a)"/>
    <path d="M290 191 L 410 191" marker-end="url(#si-a)"/>
    <path d="M290 251 C 350 251, 350 222, 410 222" marker-end="url(#si-a)"/>
    <path d="M290 311 C 350 311, 350 254, 410 254" marker-end="url(#si-a)"/>
  </g>

  <!-- SOC outputs -->
  <text x="925" y="28" text-anchor="middle" font-size="21" font-weight="700" fill="#9FB2C7">SOC · respuesta</text>
  <g text-anchor="middle" font-size="19" fill="#DCE7F3">
    <rect x="780" y="93" width="290" height="56" rx="10" fill="rgba(53,196,220,.10)" stroke="#35C4DC" stroke-width="2"/><text x="925" y="128" fill="#9EE7F5">📊 Dashboards</text>
    <rect x="780" y="163" width="290" height="56" rx="10" fill="rgba(255,153,0,.10)" stroke="#FF9900" stroke-width="2"/><text x="925" y="198" fill="#FFC061">🔔 Alertas</text>
    <rect x="780" y="233" width="290" height="56" rx="10" fill="rgba(61,163,93,.10)" stroke="#3DA35D" stroke-width="2"/><text x="925" y="268" fill="#8FE0A8">🛡️ Respuesta a incidentes</text>
  </g>
  <g stroke="#FF9900" stroke-width="3" fill="none">
    <path d="M690 150 C 735 150, 735 121, 780 121" marker-end="url(#si-o)"/>
    <path d="M690 191 L 780 191" marker-end="url(#si-o)"/>
    <path d="M690 232 C 735 232, 735 261, 780 261" marker-end="url(#si-o)"/>
  </g>

  <text x="540" y="386" text-anchor="middle" font-size="21" fill="#C9D4E0">El monitoreo cierra el ciclo: <tspan fill="#FFC061" font-weight="700">detectar → responder → mejorar</tspan></text>
  <text x="540" y="422" text-anchor="middle" font-size="17" fill="#8A97A6">La seguridad es un proceso (Unidad 1): sin visibilidad, no hay defensa</text>
</svg>
