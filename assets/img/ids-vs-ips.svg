<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="IDS fuera de línea versus IPS en línea">
  <defs>
    <marker id="i-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3DA35D"/></marker>
    <marker id="i-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#35C4DC"/></marker>
    <marker id="i-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E5484D"/></marker>
  </defs>

  <!-- ===== IDS (arriba) ===== -->
  <text x="60" y="66" font-size="22" font-weight="800" fill="#FFFFFF">IDS</text>
  <text x="60" y="88" font-size="13.5" fill="#9FB2C7">detecta y alerta · fuera de línea</text>

  <g text-anchor="middle" font-size="14" fill="#DCE7F3">
    <rect x="250" y="70" width="120" height="48" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="310" y="99">Tráfico</text>
    <rect x="700" y="70" width="120" height="48" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="760" y="99">Destino</text>
  </g>
  <!-- traffic passes straight through -->
  <path d="M370 94 L 700 94" stroke="#3DA35D" stroke-width="3" fill="none" marker-end="url(#i-g)"/>
  <!-- tap copy down to IDS sensor -->
  <line x1="535" y1="94" x2="535" y2="150" stroke="#35C4DC" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="460" y="150" width="150" height="46" rx="8" fill="#03294F" stroke="#35C4DC" stroke-width="2"/>
  <text x="535" y="178" text-anchor="middle" font-size="13" fill="#9EE7F5">Sensor IDS</text>
  <text x="535" y="140" text-anchor="middle" font-size="11" fill="#8A97A6">copia (SPAN/TAP)</text>
  <text x="880" y="178" font-size="13" fill="#FFC061">→ alerta / log</text>
  <text x="310" y="230" text-anchor="middle" font-size="12.5" fill="#8FE0A8">el tráfico NO se frena; se observa una copia</text>

  <line x1="60" y1="270" x2="1020" y2="270" stroke="#3A4A5C" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ===== IPS (abajo) ===== -->
  <text x="60" y="320" font-size="22" font-weight="800" fill="#FFFFFF">IPS</text>
  <text x="60" y="342" font-size="13.5" fill="#9FB2C7">detecta y bloquea · en línea (inline)</text>

  <g text-anchor="middle" font-size="14" fill="#DCE7F3">
    <rect x="250" y="330" width="120" height="48" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="310" y="359">Tráfico</text>
    <rect x="470" y="326" width="130" height="56" rx="8" fill="#03294F" stroke="#35C4DC" stroke-width="2"/><text x="535" y="358" font-size="13" fill="#9EE7F5">IPS inline</text>
    <rect x="700" y="330" width="120" height="48" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="760" y="359">Destino</text>
  </g>
  <!-- traffic goes through IPS -->
  <path d="M370 354 L 470 354" stroke="#3DA35D" stroke-width="3" fill="none" marker-end="url(#i-g)"/>
  <path d="M600 354 L 700 354" stroke="#3DA35D" stroke-width="3" fill="none" marker-end="url(#i-g)"/>
  <!-- blocked -->
  <path d="M535 382 L 535 420" stroke="#E5484D" stroke-width="2.5" fill="none" marker-end="url(#i-r)"/>
  <text x="560" y="410" font-size="13" fill="#F2A6A8">✕ descarta lo malicioso</text>
  <text x="310" y="430" text-anchor="middle" font-size="12.5" fill="#F2A6A8">está EN el camino: puede cortar el ataque</text>
</svg>
