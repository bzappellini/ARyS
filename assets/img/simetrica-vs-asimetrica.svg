<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Cifrado simétrico versus asimétrico">
  <defs>
    <marker id="c-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
    <g id="llave"><circle cx="0" cy="0" r="8" fill="none" stroke-width="4.5"/><line x1="6" y1="0" x2="24" y2="0" stroke-width="4.5"/><line x1="17" y1="0" x2="17" y2="8" stroke-width="4.5"/><line x1="23" y1="0" x2="23" y2="7" stroke-width="4.5"/></g>
  </defs>

  <!-- ===== SIMÉTRICA ===== -->
  <text x="40" y="56" font-size="27" font-weight="800" fill="#FFFFFF">Simétrica</text>
  <text x="40" y="82" font-size="18" fill="#9FB2C7">una MISMA clave secreta cifra y descifra</text>

  <g text-anchor="middle" font-size="18" fill="#DCE7F3">
    <rect x="40" y="104" width="160" height="60" rx="9" fill="#0A2540" stroke="#6FA8E0" stroke-width="1.5"/><text x="120" y="140">Emisor</text>
    <rect x="490" y="104" width="160" height="60" rx="9" fill="#0A2540" stroke="#6FA8E0" stroke-width="1.5"/><text x="570" y="140">Receptor</text>
    <rect x="260" y="108" width="170" height="52" rx="9" fill="#03294F" stroke="#3A4A5C"/><text x="345" y="140" font-size="16" fill="#9EE7F5">🔒 cifrado</text>
  </g>
  <path d="M200 134 L 260 134" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#c-a)"/>
  <path d="M430 134 L 490 134" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#c-a)"/>
  <!-- same key on both -->
  <use href="#llave" x="108" y="196" stroke="#FF9900" fill="#FF9900"/>
  <use href="#llave" x="558" y="196" stroke="#FF9900" fill="#FF9900"/>
  <text x="120" y="230" text-anchor="middle" font-size="15" fill="#FFC061">clave K</text>
  <text x="570" y="230" text-anchor="middle" font-size="15" fill="#FFC061">clave K</text>
  <text x="720" y="128" font-size="17" fill="#8FE0A8">+ rápida (AES, ChaCha20)</text>
  <text x="720" y="156" font-size="17" fill="#F2A6A8">− ¿cómo comparto K de forma segura?</text>

  <line x1="40" y1="254" x2="1040" y2="254" stroke="#3A4A5C" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ===== ASIMÉTRICA ===== -->
  <text x="40" y="302" font-size="27" font-weight="800" fill="#FFFFFF">Asimétrica</text>
  <text x="40" y="328" font-size="18" fill="#9FB2C7">un PAR de claves: pública cifra, privada descifra</text>

  <g text-anchor="middle" font-size="18" fill="#DCE7F3">
    <rect x="40" y="350" width="160" height="60" rx="9" fill="#0A2540" stroke="#6FA8E0" stroke-width="1.5"/><text x="120" y="386">Emisor</text>
    <rect x="490" y="350" width="160" height="60" rx="9" fill="#0A2540" stroke="#6FA8E0" stroke-width="1.5"/><text x="570" y="386">Receptor</text>
    <rect x="260" y="354" width="170" height="52" rx="9" fill="#03294F" stroke="#3A4A5C"/><text x="345" y="386" font-size="16" fill="#9EE7F5">🔒 cifrado</text>
  </g>
  <path d="M200 380 L 260 380" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#c-a)"/>
  <path d="M430 380 L 490 380" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#c-a)"/>
  <!-- public key at sender, private at receiver -->
  <use href="#llave" x="108" y="442" stroke="#35C4DC" fill="#35C4DC"/>
  <use href="#llave" x="558" y="442" stroke="#FF9900" fill="#FF9900"/>
  <text x="120" y="476" text-anchor="middle" font-size="15" fill="#9EE7F5">pública (receptor)</text>
  <text x="570" y="476" text-anchor="middle" font-size="15" fill="#FFC061">privada (receptor)</text>
  <text x="720" y="374" font-size="17" fill="#8FE0A8">+ no hay secreto que compartir</text>
  <text x="720" y="400" font-size="17" fill="#F2A6A8">− más lenta (RSA, ECC)</text>
  <text x="720" y="436" font-size="16" fill="#C9D4E0">En la práctica se combinan:</text>
  <text x="720" y="458" font-size="16" fill="#C9D4E0">asimétrica para <tspan fill="#FFC061">acordar</tspan> la clave,</text>
  <text x="720" y="480" font-size="16" fill="#C9D4E0">simétrica para <tspan fill="#FFC061">cifrar</tspan> los datos</text>
</svg>
