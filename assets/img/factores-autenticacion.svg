<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Los factores de autenticación y la autenticación multifactor">
  <text x="540" y="32" text-anchor="middle" font-size="20" fill="#9FB2C7">MFA = combinar factores de <tspan fill="#FFC061" font-weight="700">categorías distintas</tspan> (no dos contraseñas)</text>

  <!-- Factor 1: algo que sabés -->
  <rect x="10" y="54" width="256" height="272" rx="14" fill="rgba(53,196,220,.08)" stroke="#35C4DC" stroke-width="3"/>
  <text x="138" y="118" text-anchor="middle" font-size="52">🧠</text>
  <text x="138" y="166" text-anchor="middle" font-size="26" font-weight="800" fill="#9EE7F5">Algo que SABÉS</text>
  <text x="138" y="206" text-anchor="middle" font-size="19" fill="#C9D4E0">contraseña, PIN,</text>
  <text x="138" y="232" text-anchor="middle" font-size="19" fill="#C9D4E0">respuesta secreta</text>
  <text x="138" y="278" text-anchor="middle" font-size="17" fill="#F2A6A8">− se roba, se adivina,</text>
  <text x="138" y="302" text-anchor="middle" font-size="17" fill="#F2A6A8">se reutiliza</text>

  <!-- Factor 2: algo que tenés -->
  <rect x="278" y="54" width="256" height="272" rx="14" fill="rgba(255,153,0,.10)" stroke="#FF9900" stroke-width="3"/>
  <text x="406" y="118" text-anchor="middle" font-size="52">📱</text>
  <text x="406" y="166" text-anchor="middle" font-size="26" font-weight="800" fill="#FFC061">Algo que TENÉS</text>
  <text x="406" y="206" text-anchor="middle" font-size="19" fill="#C9D4E0">token, celular (OTP),</text>
  <text x="406" y="232" text-anchor="middle" font-size="19" fill="#C9D4E0">llave FIDO2</text>
  <text x="406" y="278" text-anchor="middle" font-size="17" fill="#8FE0A8">+ el atacante remoto</text>
  <text x="406" y="302" text-anchor="middle" font-size="17" fill="#8FE0A8">no lo tiene físicamente</text>

  <!-- Factor 3: algo que sos -->
  <rect x="546" y="54" width="256" height="272" rx="14" fill="rgba(167,139,250,.10)" stroke="#A78BFA" stroke-width="3"/>
  <text x="674" y="118" text-anchor="middle" font-size="52">👁️</text>
  <text x="674" y="166" text-anchor="middle" font-size="26" font-weight="800" fill="#C4B5FD">Algo que SOS</text>
  <text x="674" y="206" text-anchor="middle" font-size="19" fill="#C9D4E0">huella, rostro, iris</text>
  <text x="674" y="232" text-anchor="middle" font-size="19" fill="#C9D4E0">(biometría)</text>
  <text x="674" y="278" text-anchor="middle" font-size="17" fill="#F2A6A8">− no se puede</text>
  <text x="674" y="302" text-anchor="middle" font-size="17" fill="#F2A6A8">revocar (Unidad 2)</text>

  <!-- Contexto -->
  <rect x="814" y="54" width="256" height="272" rx="14" fill="rgba(61,163,93,.08)" stroke="#3DA35D" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="942" y="118" text-anchor="middle" font-size="52">📍</text>
  <text x="942" y="166" text-anchor="middle" font-size="26" font-weight="800" fill="#8FE0A8">…y CONTEXTO</text>
  <text x="942" y="206" text-anchor="middle" font-size="19" fill="#C9D4E0">ubicación, dispositivo,</text>
  <text x="942" y="232" text-anchor="middle" font-size="19" fill="#C9D4E0">hora, riesgo</text>
  <text x="942" y="278" text-anchor="middle" font-size="17" fill="#B9C7D8">autenticación</text>
  <text x="942" y="302" text-anchor="middle" font-size="17" fill="#B9C7D8">adaptativa</text>

  <text x="540" y="376" text-anchor="middle" font-size="23" fill="#C9D4E0">Un solo factor es frágil. <tspan fill="#FFC061" font-weight="700">Dos o más de categorías distintas</tspan> = MFA.</text>
  <text x="540" y="418" text-anchor="middle" font-size="16" fill="#8A97A6">NIST SP 800-63B · el futuro sin contraseña: FIDO2 / passkeys</text>
</svg>
