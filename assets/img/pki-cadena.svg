<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Cadena de confianza de una PKI con certificados X.509">
  <defs>
    <marker id="p-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FFC061"/></marker>
  </defs>

  <!-- Chain of trust -->
  <g text-anchor="middle">
    <!-- Root CA -->
    <rect x="40" y="150" width="240" height="130" rx="13" fill="rgba(61,163,93,.12)" stroke="#3DA35D" stroke-width="2.5"/>
    <text x="160" y="192" font-size="21" font-weight="800" fill="#8FE0A8">CA raíz</text>
    <text x="160" y="218" font-size="15.5" fill="#C9D4E0">autofirmada</text>
    <text x="160" y="244" font-size="15" fill="#9FB2C7">la raíz de la confianza</text>

    <!-- Intermediate CA -->
    <rect x="420" y="150" width="240" height="130" rx="13" fill="rgba(111,168,224,.12)" stroke="#6FA8E0" stroke-width="2.5"/>
    <text x="540" y="192" font-size="21" font-weight="800" fill="#C9DEF5">CA intermedia</text>
    <text x="540" y="218" font-size="15.5" fill="#C9D4E0">firmada por la raíz</text>
    <text x="540" y="244" font-size="15" fill="#9FB2C7">emite certificados</text>

    <!-- Server cert -->
    <rect x="800" y="150" width="240" height="130" rx="13" fill="rgba(53,196,220,.12)" stroke="#35C4DC" stroke-width="2.5"/>
    <text x="920" y="188" font-size="20" font-weight="800" fill="#9EE7F5">Certificado</text>
    <text x="920" y="210" font-size="16" fill="#DCE7F3">del servidor (X.509)</text>
    <text x="920" y="236" font-size="14" fill="#9FB2C7">clave pública + identidad</text>
    <text x="920" y="256" font-size="14" fill="#9FB2C7">(ej. www.unp.edu.ar)</text>
  </g>

  <!-- Signing arrows -->
  <path d="M280 210 L 420 210" stroke="#FFC061" stroke-width="3.5" fill="none" marker-end="url(#p-a)"/>
  <text x="350" y="196" text-anchor="middle" font-size="15" fill="#FFC061">firma</text>
  <path d="M660 210 L 800 210" stroke="#FFC061" stroke-width="3.5" fill="none" marker-end="url(#p-a)"/>
  <text x="730" y="196" text-anchor="middle" font-size="15" fill="#FFC061">firma</text>

  <!-- Browser trust store -->
  <rect x="40" y="36" width="240" height="74" rx="11" fill="#0A2540" stroke="#3A4A5C"/>
  <text x="160" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#DCE7F3">Navegador / SO</text>
  <text x="160" y="90" text-anchor="middle" font-size="14" fill="#9FB2C7">confía en la CA raíz (almacén)</text>
  <path d="M160 110 L 160 150" stroke="#3DA35D" stroke-width="2.5" fill="none" stroke-dasharray="4 4" marker-end="url(#p-a)"/>

  <!-- Caption -->
  <text x="540" y="340" text-anchor="middle" font-size="18" fill="#C9D4E0">Si confío en la raíz y cada eslabón firma al siguiente,</text>
  <text x="540" y="366" text-anchor="middle" font-size="18" fill="#C9D4E0">puedo <tspan fill="#FFC061" font-weight="700">verificar la identidad</tspan> del servidor sin conocerlo de antes.</text>
  <text x="540" y="408" text-anchor="middle" font-size="15" fill="#8A97A6">Let's Encrypt / ACME automatizan la emisión · Certificate Transparency audita lo emitido</text>
</svg>
