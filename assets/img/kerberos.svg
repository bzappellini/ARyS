<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Flujo de autenticación de Kerberos con tickets">
  <defs>
    <marker id="k-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FFC061"/></marker>
    <marker id="k-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#35C4DC"/></marker>
  </defs>

  <!-- KDC box -->
  <rect x="220" y="8" width="640" height="142" rx="14" fill="rgba(10,99,196,.14)" stroke="#6FA8E0" stroke-width="3"/>
  <text x="540" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#C9DEF5">KDC · Centro de Distribución de Claves</text>
  <rect x="240" y="52" width="290" height="88" rx="10" fill="#03294F" stroke="#3DA35D" stroke-width="3"/>
  <text x="385" y="90" text-anchor="middle" font-size="28" font-weight="700" fill="#8FE0A8">AS</text>
  <text x="385" y="120" text-anchor="middle" font-size="18" fill="#C9D4E0">autenticación</text>
  <rect x="550" y="52" width="290" height="88" rx="10" fill="#03294F" stroke="#FFC061" stroke-width="3"/>
  <text x="695" y="90" text-anchor="middle" font-size="28" font-weight="700" fill="#FFC061">TGS</text>
  <text x="695" y="120" text-anchor="middle" font-size="18" fill="#C9D4E0">otorga tickets</text>

  <!-- Cliente -->
  <rect x="10" y="178" width="200" height="160" rx="14" fill="#0A2540" stroke="#6FA8E0" stroke-width="3"/>
  <text x="110" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#DCE7F3">Cliente</text>
  <text x="110" y="278" text-anchor="middle" font-size="18" fill="#9FB2C7">(el usuario)</text>

  <!-- Servicio -->
  <rect x="870" y="178" width="200" height="160" rx="14" fill="#0A2540" stroke="#6FA8E0" stroke-width="3"/>
  <text x="970" y="248" text-anchor="middle" font-size="28" font-weight="700" fill="#DCE7F3">Servicio</text>
  <text x="970" y="278" text-anchor="middle" font-size="18" fill="#9FB2C7">(app, servidor)</text>

  <!-- Step 1: client -> AS (arrow enters AS from below), get TGT -->
  <path d="M212 210 H385 V146" stroke="#FFC061" stroke-width="3.5" fill="none" stroke-linejoin="round" marker-end="url(#k-a)"/>
  <circle cx="262" cy="210" r="16" fill="#FF9900"/><text x="262" y="217" text-anchor="middle" font-size="19" font-weight="800" fill="#021C36">1</text>
  <text x="404" y="198" font-size="18" fill="#FFC061">me autentico → recibo TGT</text>

  <!-- Step 2: client -> TGS (arrow enters TGS from below), get service ticket -->
  <path d="M212 258 H695 V146" stroke="#FFC061" stroke-width="3.5" fill="none" stroke-linejoin="round" marker-end="url(#k-a)"/>
  <circle cx="262" cy="258" r="16" fill="#FF9900"/><text x="262" y="265" text-anchor="middle" font-size="19" font-weight="800" fill="#021C36">2</text>
  <text x="292" y="288" font-size="18" fill="#FFC061">presento TGT → recibo ticket de servicio</text>

  <!-- Step 3: client -> service with service ticket -->
  <path d="M212 306 H864" stroke="#35C4DC" stroke-width="3.5" fill="none" marker-end="url(#k-b)"/>
  <circle cx="262" cy="306" r="16" fill="#35C4DC"/><text x="262" y="313" text-anchor="middle" font-size="19" font-weight="800" fill="#021C36">3</text>
  <text x="292" y="338" font-size="18" fill="#9EE7F5">presento el ticket → acceso concedido</text>

  <!-- captions -->
  <text x="540" y="378" text-anchor="middle" font-size="20" fill="#C9D4E0">La contraseña <tspan fill="#FFC061" font-weight="700">nunca viaja</tspan> por la red; con el TGT pido varios servicios</text>
  <text x="540" y="404" text-anchor="middle" font-size="20" fill="#C9D4E0">→ es la base del <tspan fill="#FFC061" font-weight="700">Single Sign-On</tspan> (RFC 4120)</text>
  <text x="540" y="438" text-anchor="middle" font-size="16" fill="#8A97A6">Ataques a conocer: Pass-the-Ticket · Kerberoasting · Golden/Silver Ticket</text>
</svg>
