<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Arquitectura de red con DMZ entre dos firewalls">
  <defs>
    <marker id="d-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
  </defs>

  <!-- Internet -->
  <g text-anchor="middle">
    <circle cx="80" cy="235" r="52" fill="#3a1416" stroke="#E5484D" stroke-width="2"/>
    <text x="80" y="230" font-size="17" font-weight="700" fill="#F2A6A8">Internet</text>
    <text x="80" y="252" font-size="12" fill="#C9D4E0">no confiable</text>
  </g>

  <!-- Firewall externo -->
  <g text-anchor="middle">
    <rect x="196" y="180" width="60" height="110" rx="8" fill="#FF9900"/>
    <text x="226" y="230" font-size="13" font-weight="800" fill="#021C36">FW</text>
    <text x="226" y="248" font-size="12" font-weight="700" fill="#021C36">ext</text>
    <text x="226" y="316" font-size="12" fill="#9FB2C7">firewall</text>
    <text x="226" y="332" font-size="12" fill="#9FB2C7">externo</text>
  </g>

  <!-- DMZ -->
  <rect x="300" y="70" width="300" height="330" rx="14" fill="rgba(53,196,220,.07)" stroke="#35C4DC" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="450" y="100" text-anchor="middle" font-size="18" font-weight="800" fill="#9EE7F5">DMZ</text>
  <text x="450" y="120" text-anchor="middle" font-size="12.5" fill="#9FB2C7">zona desmilitarizada · servicios públicos</text>
  <g text-anchor="middle" font-size="13" fill="#DCE7F3">
    <rect x="330" y="150" width="110" height="52" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="385" y="181">Web</text>
    <rect x="460" y="150" width="110" height="52" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="515" y="181">Mail</text>
    <rect x="330" y="222" width="110" height="52" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="385" y="253">DNS</text>
    <rect x="460" y="222" width="110" height="52" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="515" y="253">Proxy rev.</text>
  </g>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#8A97A6">expuestos a Internet, aislados de la LAN</text>

  <!-- Firewall interno -->
  <g text-anchor="middle">
    <rect x="644" y="180" width="60" height="110" rx="8" fill="#FF9900"/>
    <text x="674" y="230" font-size="13" font-weight="800" fill="#021C36">FW</text>
    <text x="674" y="248" font-size="12" font-weight="700" fill="#021C36">int</text>
    <text x="674" y="316" font-size="12" fill="#9FB2C7">firewall</text>
    <text x="674" y="332" font-size="12" fill="#9FB2C7">interno</text>
  </g>

  <!-- LAN -->
  <rect x="748" y="120" width="300" height="230" rx="14" fill="rgba(61,163,93,.08)" stroke="#3DA35D" stroke-width="2"/>
  <text x="898" y="150" text-anchor="middle" font-size="18" font-weight="800" fill="#8FE0A8">LAN interna</text>
  <text x="898" y="170" text-anchor="middle" font-size="12.5" fill="#9FB2C7">red confiable</text>
  <g text-anchor="middle" font-size="13" fill="#DCE7F3">
    <rect x="778" y="195" width="110" height="50" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="833" y="225">Estaciones</text>
    <rect x="908" y="195" width="110" height="50" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="963" y="225">Servidores</text>
    <rect x="843" y="265" width="110" height="50" rx="8" fill="#0A2540" stroke="#3A4A5C"/><text x="898" y="295">BD interna</text>
  </g>

  <!-- flows -->
  <g stroke="#9FB2C7" stroke-width="2.5" fill="none">
    <path d="M132 235 L 196 235" marker-end="url(#d-a)"/>
    <path d="M256 235 L 300 235" marker-end="url(#d-a)"/>
    <path d="M600 235 L 644 235" marker-end="url(#d-a)"/>
    <path d="M704 235 L 748 235" marker-end="url(#d-a)"/>
  </g>
</svg>
