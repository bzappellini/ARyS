<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Funcionamiento de TOTP: contraseña de un solo uso basada en tiempo">
  <defs>
    <marker id="o-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
  </defs>

  <text x="540" y="32" text-anchor="middle" font-size="20" fill="#9FB2C7">Una sola <tspan fill="#FFC061" font-weight="700">semilla secreta</tspan> compartida al inicio (por QR); nunca vuelve a viajar</text>

  <!-- App -->
  <rect x="10" y="54" width="280" height="166" rx="14" fill="#0A2540" stroke="#FF9900" stroke-width="3"/>
  <text x="150" y="96" text-anchor="middle" font-size="25" font-weight="800" fill="#FFC061">📱 App (celular)</text>
  <text x="150" y="130" text-anchor="middle" font-size="18" fill="#C9D4E0">Google Authenticator,</text>
  <text x="150" y="154" text-anchor="middle" font-size="18" fill="#C9D4E0">Authy…</text>
  <text x="150" y="196" text-anchor="middle" font-size="17" fill="#8FE0A8">🔑 tiene la semilla</text>

  <!-- Server -->
  <rect x="790" y="54" width="280" height="166" rx="14" fill="#0A2540" stroke="#6FA8E0" stroke-width="3"/>
  <text x="930" y="96" text-anchor="middle" font-size="25" font-weight="800" fill="#C9DEF5">🖥️ Servidor</text>
  <text x="930" y="130" text-anchor="middle" font-size="18" fill="#C9D4E0">valida el código</text>
  <text x="930" y="196" text-anchor="middle" font-size="17" fill="#8FE0A8">🔑 tiene la MISMA semilla</text>

  <!-- Function boxes -->
  <rect x="345" y="78" width="390" height="118" rx="12" fill="rgba(53,196,220,.10)" stroke="#35C4DC" stroke-width="3"/>
  <text x="540" y="126" text-anchor="middle" font-size="20" fill="#9EE7F5">HMAC( semilla , tiempo actual )</text>
  <text x="540" y="160" text-anchor="middle" font-size="19" fill="#C9D4E0">→ truncar → código de 6 dígitos</text>

  <path d="M292 137 L 341 137" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#o-a)"/>
  <path d="M737 137 L 786 137" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#o-a)"/>

  <!-- Same code both compute -->
  <rect x="380" y="246" width="320" height="84" rx="14" fill="#3a2a00" stroke="#FF9900" stroke-width="3"/>
  <text x="540" y="302" text-anchor="middle" font-size="46" font-weight="800" font-family="ui-monospace,monospace" fill="#FFC061">738 412</text>
  <text x="540" y="364" text-anchor="middle" font-size="20" fill="#C9D4E0">ambos calculan el <tspan fill="#FFC061" font-weight="700">mismo</tspan> código, sin comunicarse</text>

  <!-- time window -->
  <text x="540" y="396" text-anchor="middle" font-size="20" fill="#C9D4E0">Cambia cada <tspan fill="#35C4DC" font-weight="700">30 segundos</tspan> — si lo interceptan, ya venció</text>
  <text x="540" y="428" text-anchor="middle" font-size="16" fill="#8A97A6">TOTP: RFC 6238 (basado en tiempo) · HOTP: RFC 4226 (basado en contador)</text>
</svg>
