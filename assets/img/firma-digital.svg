<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Funcionamiento de la firma digital: firmar y verificar">
  <defs>
    <marker id="f-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
  </defs>

  <!-- ===== FIRMAR (izquierda) ===== -->
  <text x="60" y="44" font-size="25" font-weight="800" fill="#9EE7F5">FIRMAR · lo hace el emisor</text>
  <g text-anchor="middle" font-size="17" fill="#DCE7F3">
    <rect x="60" y="70" width="170" height="62" rx="9" fill="#0A2540" stroke="#3A4A5C"/><text x="145" y="107">Documento</text>
    <rect x="60" y="180" width="170" height="56" rx="9" fill="#03294F" stroke="#35C4DC"/><text x="145" y="214" font-size="16" fill="#9EE7F5">hash (resumen)</text>
    <rect x="60" y="300" width="170" height="62" rx="9" fill="#3a2a00" stroke="#FF9900"/><text x="145" y="337" font-size="16" fill="#FFC061">FIRMA</text>
  </g>
  <path d="M145 132 L 145 180" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#f-a)"/>
  <text x="240" y="162" font-size="15" fill="#9FB2C7">función hash</text>
  <path d="M145 236 L 145 300" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#f-a)"/>
  <text x="160" y="262" font-size="15" fill="#FFC061" text-anchor="start">cifrar el hash con</text>
  <text x="160" y="282" font-size="15" fill="#FFC061" text-anchor="start">la clave PRIVADA</text>

  <!-- transmit -->
  <text x="540" y="200" text-anchor="middle" font-size="16" fill="#C9D4E0">se envía</text>
  <text x="540" y="224" text-anchor="middle" font-size="16" fill="#DCE7F3" font-weight="700">documento + firma</text>
  <path d="M240 331 C 400 331, 420 245, 540 238" stroke="#9FB2C7" stroke-width="2.5" fill="none" stroke-dasharray="4 5" marker-end="url(#f-a)"/>
  <line x1="480" y1="40" x2="480" y2="470" stroke="#3A4A5C" stroke-width="1.2" stroke-dasharray="5 6"/>

  <!-- ===== VERIFICAR (derecha) ===== -->
  <text x="620" y="44" font-size="25" font-weight="800" fill="#8FE0A8">VERIFICAR · lo hace el receptor</text>
  <g text-anchor="middle" font-size="17" fill="#DCE7F3">
    <rect x="620" y="70" width="170" height="62" rx="9" fill="#0A2540" stroke="#3A4A5C"/><text x="705" y="107">Documento</text>
    <rect x="620" y="180" width="170" height="56" rx="9" fill="#03294F" stroke="#35C4DC"/><text x="705" y="214" font-size="16" fill="#9EE7F5">hash calculado</text>
    <rect x="870" y="70" width="170" height="62" rx="9" fill="#3a2a00" stroke="#FF9900"/><text x="955" y="98" font-size="16" fill="#FFC061">FIRMA</text><text x="955" y="120" font-size="14" fill="#C9D4E0">recibida</text>
    <rect x="870" y="180" width="170" height="56" rx="9" fill="#03294F" stroke="#35C4DC"/><text x="955" y="214" font-size="16" fill="#9EE7F5">hash descifrado</text>
  </g>
  <path d="M705 132 L 705 180" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#f-a)"/>
  <path d="M955 132 L 955 180" stroke="#9FB2C7" stroke-width="3" fill="none" marker-end="url(#f-a)"/>
  <text x="942" y="156" font-size="15" fill="#9EE7F5" text-anchor="end">descifrar con la</text>
  <text x="942" y="176" font-size="15" fill="#9EE7F5" text-anchor="end">clave PÚBLICA</text>

  <!-- compare -->
  <rect x="725" y="300" width="200" height="66" rx="11" fill="rgba(61,163,93,.14)" stroke="#3DA35D" stroke-width="2"/>
  <text x="825" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#8FE0A8">¿coinciden?</text>
  <text x="825" y="352" text-anchor="middle" font-size="15" fill="#C9D4E0">sí → auténtico e íntegro</text>
  <path d="M705 236 C 705 285, 760 295, 748 305" stroke="#35C4DC" stroke-width="2.5" fill="none" marker-end="url(#f-a)"/>
  <path d="M955 236 C 955 285, 900 295, 912 305" stroke="#35C4DC" stroke-width="2.5" fill="none" marker-end="url(#f-a)"/>

  <text x="760" y="440" text-anchor="middle" font-size="17" fill="#C9D4E0">Aporta <tspan fill="#FFC061" font-weight="700">integridad</tspan>, <tspan fill="#FFC061" font-weight="700">autenticidad</tspan> y <tspan fill="#FFC061" font-weight="700">no repudio</tspan> (Unidad 1)</text>
</svg>
