<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" font-family="system-ui,'Segoe UI','DejaVu Sans',sans-serif" role="img" aria-label="Relación entre amenaza, vulnerabilidad, activo y riesgo">
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9FB2C7"/></marker>
  </defs>
  <!-- Three inputs -->
  <g>
    <rect x="40" y="60" width="240" height="86" rx="12" fill="rgba(229,72,77,.16)" stroke="#E5484D" stroke-width="2"/>
    <text x="160" y="98" text-anchor="middle" font-size="21" font-weight="700" fill="#F2A6A8">AMENAZA</text>
    <text x="160" y="124" text-anchor="middle" font-size="14" fill="#C9D4E0">quién / qué puede dañar</text>

    <rect x="40" y="166" width="240" height="86" rx="12" fill="rgba(255,153,0,.14)" stroke="#FF9900" stroke-width="2"/>
    <text x="160" y="204" text-anchor="middle" font-size="21" font-weight="700" fill="#FFC061">VULNERABILIDAD</text>
    <text x="160" y="230" text-anchor="middle" font-size="14" fill="#C9D4E0">debilidad explotable</text>

    <rect x="40" y="272" width="240" height="86" rx="12" fill="rgba(53,196,220,.14)" stroke="#35C4DC" stroke-width="2"/>
    <text x="160" y="310" text-anchor="middle" font-size="21" font-weight="700" fill="#9EE7F5">ACTIVO</text>
    <text x="160" y="336" text-anchor="middle" font-size="14" fill="#C9D4E0">lo que tiene valor</text>
  </g>

  <!-- arrows to combine -->
  <g fill="none" stroke="#9FB2C7" stroke-width="2.5">
    <path d="M280 103 C 400 103, 420 190, 520 205" marker-end="url(#ra)"/>
    <path d="M280 209 L 520 209" marker-end="url(#ra)"/>
    <path d="M280 315 C 400 315, 420 228, 520 213" marker-end="url(#ra)"/>
  </g>

  <!-- Risk result -->
  <rect x="560" y="150" width="300" height="118" rx="16" fill="#FF9900"/>
  <text x="710" y="200" text-anchor="middle" font-size="30" font-weight="800" fill="#021C36">RIESGO</text>
  <text x="710" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#3A2A00">probabilidad × impacto</text>

  <!-- controls reduce -->
  <path d="M710 268 L 710 330" fill="none" stroke="#3DA35D" stroke-width="3" marker-end="url(#ra)"/>
  <rect x="560" y="332" width="300" height="60" rx="12" fill="rgba(61,163,93,.16)" stroke="#3DA35D" stroke-width="2"/>
  <text x="710" y="369" text-anchor="middle" font-size="18" font-weight="700" fill="#8FE0A8">CONTROLES → reducen el riesgo</text>
</svg>
